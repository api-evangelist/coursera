openapi: 3.2.0
info:
  title: Search V1 Controller API
  version: v1
servers:
- url: https://www.coursera.org
  description: API schema for search APIs exposed to 3rd party services (e.g. OpenAI)
tags:
- name: search-v1-controller
paths:
  /api/rest/v1/search:
    post:
      summary: A public API that searches the Coursera catalog for products (e.g.
      tags:
      - search-v1-controller
      operationId: search
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchQuery'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
components:
  schemas:
    SearchHit:
      type: object
      properties:
        name:
          type: string
        partners:
          type: array
          items:
            type: string
        duration:
          type: string
        partnerLogos:
          type: array
          items:
            type: string
        productDifficultyLevel:
          type: string
        entityType:
          type: string
        avgProductRating:
          type: string
        skills:
          type: string
        imageUrl:
          type: string
        isCourseFree:
          type: string
        isPartOfCourseraPlus:
          type: string
        objectUrl:
          type: string
    SearchResponse:
      properties:
        hits:
          type: array
          items:
            $ref: '#/components/schemas/SearchHit'
    SearchQuery:
      type: object
      properties:
        query:
          type: string
      required:
      - query
      example:
        query: machine learning
x-provenance:
  method: harvested
  publisher: Coursera
  source: https://api.coursera.org/openapi.yaml
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
